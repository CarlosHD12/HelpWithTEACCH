spring.application.name=HelpWithTEACCH

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/db_helpwithteacch}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgre}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET:HelpWithTEACCH-JWT-Secret-2026-Local-123456}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# IA SERVICE
# ===============================
ia.service.url=${IA_SERVICE_URL:http://127.0.0.1:8000}

# ===============================
# ADMIN DEFAULT
# ===============================
app.admin.email=${ADMIN_EMAIL:admin@helpwithteacch.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
app.admin.nombres=Administrador
app.admin.apellidos=Sistema
spring.application.name=HelpWithTEACCH

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_helpwithteacch
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# JWT
# ===============================
security.jwt.secret=HelpWithTEACCH-JWT-Secret-2026-Local-123456
security.jwt.expiration=86400000

# ===============================
# IA SERVICE
# ===============================
ia.service.url=http://127.0.0.1:8000

# ===============================
# ADMIN DEFAULT
# ===============================
app.admin.email=admin@helpwithteacch.com
app.admin.password=Admin12345
app.admin.nombres=Administrador
app.admin.apellidos=Sistema